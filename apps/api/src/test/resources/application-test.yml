spring:
  datasource:
    url: jdbc:h2:mem:library;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate

app:
  seed: false
  bcrypt-strength: 4
  jwt:
    secret: test-secret-test-secret-test-secret-32
  storage:
    dir: ${java.io.tmpdir}/library-api-test-uploads

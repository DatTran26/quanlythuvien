name: Bug
description: Report a defect
title: "fix: "
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Expected vs actual.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduce
      description: Steps, branch, env.
    validations:
      required: true
  - type: input
    id: branch
    attributes:
      label: Branch
      placeholder: develop/name or develop1
